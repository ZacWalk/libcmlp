name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.lane }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [release-debug, scalar]
    defaults:
      run:
        shell: pwsh
    steps:
      # The Fashion-MNIST CSVs are git-lfs and far too large to pull on every run, so the
      # workflow only runs the 'ci' tests, which train on a generated dataset instead.
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Keep scratch files in the checkout
        run: |
          $scratch = Join-Path $PWD 'tmp'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          "TEMP=$scratch", "TMP=$scratch", "TMPDIR=$scratch" | Add-Content $env:GITHUB_ENV

      - name: Build and test Release and Debug
        if: matrix.lane == 'release-debug'
        run: pwsh -NoProfile -File dd.ps1 test --label '^ci$' --non-interactive

      - name: Build and test portable scalar kernels
        if: matrix.lane == 'scalar'
        run: pwsh -NoProfile -File dd.ps1 scalar --yes --non-interactive
